[project]
name = "zeroos"
version = "0.1.0"
description = "A text-driven assistant that operates your Linux desktop through a fixed catalog of safe actions."
requires-python = ">=3.11"
dependencies = ["openai>=2.34.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
zeroos = "zeroos.surface.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zeroos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# pytest's default tmp_path lives under /tmp, which is tmpfs on most desktops.
# Gio.File.trash() refuses to trash on system internal mounts, so the tests that
# prove ZeroOS moves files to the trash rather than deleting them — the product's
# central promise — cannot run there. Keeping scratch files on the same real
# filesystem as the repo lets them actually exercise it.
addopts = "--basetemp=.pytest-tmp"
