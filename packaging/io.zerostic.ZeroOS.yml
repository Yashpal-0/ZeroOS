app-id: io.zerostic.ZeroOS
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: zeroos

finish-args:
  # The whole product is operating the user's files.
  - --filesystem=home
  # Volume control via pactl.
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Talking to the model.
  - --share=network
  # API key storage.
  - --talk-name=org.freedesktop.secrets
  # Notifications.
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: pulseaudio-utils
    buildsystem: simple
    build-commands:
      - install -Dm755 /usr/bin/pactl /app/bin/pactl || true
    sources: []

  - name: python-deps
    buildsystem: simple
    build-commands:
      # Flatpak builds offline: every source below is a local sdist by the
      # time this runs, so install by name with --no-index/--find-links
      # rather than reaching out to PyPI.
      - pip3 install --prefix=/app --no-index --find-links=. --no-build-isolation
