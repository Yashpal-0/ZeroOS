      - type: file
        url: https://files.pythonhosted.org/packages/99/91/8acff4f5e50511b911bbccb72b8628a49c68ce14148cd9f6431094859a90/annotated_types-0.8.0-py3-none-any.whl
        sha256: f072f4d804ea359e4eaf198b1af7a8b0943881a87f31bb764f8bf219bb9419e0

  - name: zeroos
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-build-isolation .
      - install -Dm644 packaging/io.zerostic.ZeroOS.desktop /app/share/applications/io.zerostic.ZeroOS.desktop
      - install -Dm644 packaging/io.zerostic.ZeroOS.metainfo.xml /app/share/metainfo/io.zerostic.ZeroOS.metainfo.xml
      # The .desktop file's Icon= key names this; without it appstreamcli fails
      # the build outright with icon-not-found.
      - install -Dm644 packaging/io.zerostic.ZeroOS.svg /app/share/icons/hicolor/scalable/apps/io.zerostic.ZeroOS.svg
    sources:
      - type: dir
        path: ..
        # Build output and test scratch, none of which belongs in the source
        # copy. This is not tidiness: flatpak-builder's own app dir contains
        # var/run -> /run, and setuptools' package discovery walks with
        # followlinks=True. Because this repo lives under /run/media, following
        # that link re-enters the whole volume, and `pip install .` spends
        # minutes crawling unrelated trees instead of ~2 seconds. Step 3 of the
        # migration task creates ./build in the project root, so leaving these
        # unskipped breaks the *next* build rather than the current one.
        skip:
          - build
          - .flatpak-builder
          - .pytest-tmp
          - .git
