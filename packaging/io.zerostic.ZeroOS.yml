app-id: io.zerostic.ZeroOS
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: zeroos

finish-args:
  # The whole product is operating the user's files.
  - --filesystem=home
  # Volume control via pactl.
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Talking to the model.
  - --share=network
  # API key storage.
  - --talk-name=org.freedesktop.secrets
  # Notifications.
  - --talk-name=org.freedesktop.Notifications
  # Running commands on the host: stdio MCP servers, and run_command.
  # This is a genuine escape from the sandbox -- with it, ZeroOS can run any
  # command as the user. The confirm dialog is what makes it survivable.
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: pulseaudio-utils
    buildsystem: simple
    build-commands:
      - install -Dm755 /usr/bin/pactl /app/bin/pactl || true
    sources: []

  - name: python-deps
    buildsystem: simple
    build-commands:
      # Flatpak builds offline: every source below is a local wheel by the time
      # this runs, so install from the staged files with --no-index rather than
      # reaching out to PyPI.
      #
      # Wheels, not sdists. jiter and pydantic-core are Rust (pyo3) extensions
      # and org.gnome.Sdk//50 ships no cargo; the SDK also has only setuptools,
      # not the hatchling/maturin backends most of these build with, so an sdist
      # install fails at "Cannot import 'hatchling.build'" before Rust is even
      # reached. Upstream already publishes cp313 manylinux wheels matching the
      # runtime's Python 3.13 — using them is both simpler and reproducible.
      #
      # The cp313 tag is tied to the runtime version above. Bumping the runtime
      # without re-deriving these two fails at import inside the sandbox, not at
      # install: pip is happy to stage a wheel whose ABI the interpreter cannot
      # load. The other fourteen are py3-none-any and are unaffected.
      - pip3 install --prefix=/app --no-index --no-deps *.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/f2/40/f090499f10514515081d09cb9da09f25b821eb20497e9423afe4f07b4ecf/openai-2.34.0-py3-none-any.whl
        sha256: c996a71b1a210f3569844572ad4c609307e978515fb76877cf449b72596e549e
